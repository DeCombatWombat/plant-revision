<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horticulture Revision App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
     <h1>Horticulture Revision</h1>
</header>
    <main class="menu">
        <div class="tile-container">
            <div class="tile">
                <div class="tile-title">Flashcards</div>
                <div class="tile-desc">
                    Test your knowledge with image questions and tables of plant info
                    <br>
                    <a href="flashcards.html">
                        <button id="allFlashcardButton" class="button">All</button>
                    </a>

                    <br>
                    <a href="flashcards.html">
                        <button id="randomFlashcardButton" class="button">Random</button>
                    </a>
                </div>
            </div>

            <div class="tile">
                <div class="tile-title">Spelling Practice</div>
                <div class="tile-desc">Practice spelling the latin terms of plants correctly</div>
                <br>
                <a href="spelling.html">
                    <button id="allSpellingButton" class="button">All</button>
                </a>

                <br>
                <a href="spelling.html">
                    <button id="randomSpellingButton" class="button">Random</button>
                </a>
            </div>

            <a href="view.html" class="tile">
                <div class="tile-title">View Mode</div>
                <div class="tile-desc">Browse all cards with answers visible</div>
            </a>

            <a href="stats.html" class="tile">
                <div class="tile-title">Statistics</div>
                <div class="tile-desc">See which plants you miss the most and track your progress</div>
            </a>
        </div>
    </main>
    <script src="index.js"></script>
</body>
</html>
